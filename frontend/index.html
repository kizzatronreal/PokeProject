<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>Poke Project</title>
</head>
<body>
    <h1>PokeProject - Team Analyzer</h1>
    <input type="text" id="userpokemon" placeholder="Type Pokemon name here!">
    <button class="btn btn-primary" id="userbtn">Add Pokemon</button>
    <div class="card" style="width: 18rem;">
    <img class="card-img-top" src="..." alt="Card image cap">
    <div class="card-body">
        <h5 class="card-title">Card title</h5>
        <table class="multipliers">
                <tbody>
                    <tr>
                        <th><img src="img/normal.jpg"></th>
                        <th><img src="img/fire.jpg"></th>
                        <th><img src="img/water.jpg"></th>
                        <th><img src="img/electric.jpg"></th>
                        <th><img src="img/grass.jpg"></th>
                        <th><img src="img/ice.jpg"></th>
                        <th><img src="img/fighting.jpg"></th>
                        <th><img src="img/poison.jpg"></th>
                        <th><img src="img/ground.jpg"></th>
                    </tr>
                    <tr>
                        <th id="normal"></th>
                        <th id="fire"></th>
                        <th id="water"></th>
                        <th id="electric"></th>
                        <th id="grass"></th>
                        <th id="ice"></th>
                        <th id="fighting"></th>
                        <th id="poison"></th>
                        <th id="ground"></th>
                    </tr>
                </tbody>
            </table>
            <table class="multipliers">
                <tbody>
                    <tr>
                        <th><img src="img/flying.jpg"></th>
                        <th><img src="img/psychic.jpg"></th>
                        <th><img src="img/bug.jpg"></th>
                        <th><img src="img/rock.jpg"></th>
                        <th><img src="img/ghost.jpg"></th>
                        <th><img src="img/dragon.jpg"></th>
                        <th><img src="img/dark.jpg"></th>
                        <th><img src="img/steel.jpg"></th>
                        <th><img src="img/fairy.jpg"></th>
                    </tr>
                    <tr>
                        <th id="flying"></th>
                        <th id="psychic"></th>
                        <th id="bug"></th>
                        <th id="rock"></th>
                        <th id="ghost"></th>
                        <th id="dragon"></th>
                        <th id="dark"></th>
                        <th id="steel"></th>
                        <th id="fairy"></th>
                    </tr>
                </tbody>
            </table>
        <a href="#" class="btn btn-primary">Go somewhere</a>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
